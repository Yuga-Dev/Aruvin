# ============================================================================
# FILE: nginx.conf
# LOCATION: deployment/docker/nginx.conf
# PURPOSE: Serve the SPA and reverse-proxy /api to the loopback-bound backend.
# ROLE IN PROJECT: Owns the network namespace the backend joins, so the
#   backend sees a 127.0.0.1 peer (required by its auth/admin ingress checks).
# KEY COMPONENTS: SPA fallback, unbuffered streaming, WebSocket upgrade.
# ============================================================================
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 8080;
  root /usr/share/nginx/html;

  location / { try_files $uri /index.html; }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Overwrite, never pass through client-supplied values.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
